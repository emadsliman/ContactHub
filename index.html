<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- web name & logo -->
    <title>ContactHub - Smart Contact Manager</title>
    <link rel="icon" type="image/png" href="images/favicon.png" />
    <!-- end web name & logo -->

    <!-- fontawsom -->
    <link rel="stylesheet" href="css/all.min.css" />
    <!--end fontawsom -->
    <!-- css & bootstrab -->
    <link rel="stylesheet" href="css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/style.css" />
    <!--end css & bootstrab -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
  </head>
  <body>
    <nav id="navbar" class="navbar navbar-expand-lg bg-white py-2 sticky-top">
      <div class="container">
        <div class="navbar-brand d-flex align-items-center gap-4">
          <div
            class="logo-icon d-flex align-items-center justify-content-center rounded-4"
          >
            <i class="fa-solid fa-address-book"></i>
          </div>
          <div class="d-flex flex-column align-items-start">
            <h1 class="fs-4 fw-bold m-0 p-0">
              Contact<span class="spn-hub">Hub</span>
            </h1>
            <p class="fs-6 text-secondary m-0 p-0">Smart Contact Manager</p>
          </div>
        </div>

        <!-- Toggler -->
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarSupportedContent"
          aria-controls="navbarSupportedContent"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <i class="fa-solid fa-bars"></i>
        </button>

        <!-- Navbar Content -->
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-4">
            <li>
              <button
                type="button"
                class="btn py-2 px-3 rounded-4"
                data-bs-toggle="modal"
                data-bs-target="#exampleModal"
              >
                <span class="fw-bold">+ Add Contact</span>
              </button>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#">
                <i class="fa-solid fa-bell"></i>
              </a>
            </li>

            <!-- Settings -->
            <li class="nav-item">
              <a class="nav-link" href="#">
                <i class="fa-solid fa-gear"></i>
              </a>
            </li>

            <!-- img Profile -->
            <li class="nav-item">
              <div
                class="img-nav-profile overflow-hidden object-fit-cover rounded-4"
              >
                <img
                  class="w-100 h-100"
                  src="images/avatar-4.jpg"
                  alt="Profile"
                />
              </div>
            </li>
          </ul>
        </div>
      </div>
    </nav>
    <!-- Model Bottom navbar -->
    <div
      class="modal fade"
      id="exampleModal"
      tabindex="-1"
      aria-labelledby="exampleModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-dialog-scrollable">
        <div class="modal-content">
          <div class="modal-header">
            <h1 class="modal-title fs-5" id="exampleModalLabel">
              Add New Contact
            </h1>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <form id="form" action="">
              <div
                class="d-flex flex-column align-items-center text-center my-3"
              >
                <div class="static-photo mb-3">
                  <div
                    class="icon-static rounded-circle d-flex align-items-center justify-content-center"
                  >
                    <i class="fa-solid fa-user"></i>
                  </div>
                </div>
                <div class="input-label">
                  <input
                    type="file"
                    class="d-none"
                    id="contactImage"
                    accept="image/*"
                  />
                  <div class="change-photo rounded-3">
                    <label for="contactImage" class="py-2 px-3">
                      <div class="d-flex align-items-center gap-2">
                        <span><i class="fa-solid fa-camera"></i></span>
                        <span>Change Photo</span>
                      </div>
                    </label>
                  </div>
                </div>
              </div>

              <div class="mb-3">
                <label for="contactName" class="form-label text-black">
                  Full Name <span class="span-red">*</span>
                </label>

                <input
                  type="text"
                  class="form-control"
                  id="contactName"
                  placeholder="Enter full name"
                />
              </div>

              <div class="mb-3">
                <label for="contactPhone" class="form-label">
                  Phone Number <span class="span-red">*</span>
                </label>

                <input
                  type="tel"
                  class="form-control"
                  id="contactPhone"
                  placeholder="e.g., 01012345678"
                />
              </div>

              <div class="mb-3">
                <label for="contactEmail" class="form-label">
                  Email Address
                </label>

                <input
                  type="email"
                  class="form-control"
                  id="contactEmail"
                  placeholder="name@example.com"
                />
              </div>

              <div class="mb-3">
                <label for="contactAddress" class="form-label"> Address </label>

                <input
                  type="text"
                  class="form-control"
                  id="contactAddress"
                  placeholder="Enter address"
                />
              </div>

              <div class="mb-3">
                <label for="contactGroup" class="form-label"> Group </label>

                <select class="form-select" id="contactGroup">
                  <option disabled>Select a group</option>
                  <option>Family</option>
                  <option>Friends</option>
                  <option>Work</option>
                  <option>Other</option>
                </select>
              </div>

              <div class="mb-3">
                <label for="contactNotes" class="form-label"> Notes </label>

                <textarea
                  class="form-control"
                  id="contactNotes"
                  rows="2"
                ></textarea>
              </div>

              <div class="d-flex align-items-center gap-4 mb-3">
                <div class="form-check">
                  <input
                    class="form-check-input"
                    type="checkbox"
                    id="favorite"
                  />

                  <label class="form-check-label" for="favorite">
                    <div class="d-flex align-items-center gap-1">
                      <span class="star-icon"
                        ><i class="fa-solid fa-star"></i
                      ></span>
                      <span class="title-check-sapn">Favorite</span>
                    </div>
                  </label>
                </div>

                <div class="form-check">
                  <input
                    class="form-check-input"
                    type="checkbox"
                    id="emergency"
                  />

                  <label class="form-check-label" for="emergency">
                    <div>
                      <span class="heart-icon">
                        <i class="fa-solid fa-heart-pulse"></i>
                      </span>
                      <span class="title-check-sapn">Emergency</span>
                    </div>
                  </label>
                </div>
              </div>
            </form>
          </div>
          <div class="d-flex gap-2 align-items-center p-3">
            <button
              type="button"
              class="btn btn-exit px-2 py-3 w-50 rounded-4"
              data-bs-dismiss="modal"
            >
              Close
            </button>
            <button
              id="saveContantBtn"
              onclick="saveContant()"
              type="button"
              class="btn btn-save-contant px-2 py-3 w-50 rounded-4"
            >
              Save Contant
            </button>

            <button
              id="updatecontantBtn"
              onclick="updateContact()"
              type="button"
              class="btn btn-update-contant px-2 py-3 w-50 rounded-4 d-none"
            >
              Update contant
            </button>
          </div>
        </div>
      </div>
    </div>
    <!-- end model botom navbar -->

    <!-- section -->

    <div id="hero-section" class="">
      <div class="container py-5">
        <div class="row g-4 mb-5">
          <div class="col-12 col-lg-4">
            <div class="card rounded-4">
              <div class="card-body d-flex gap-3 align-items-center">
                <div
                  class="card-icon1 d-flex align-items-center justify-content-center p-3 rounded-4"
                >
                  <i class="fa-solid fa-users"></i>
                </div>

                <div class="card-titel">
                  <p class="text-secondary m-0">TOTAL</p>
                  <span id="totalcount" class="fs-4 fw-bold m-0">0</span>
                </div>
              </div>
            </div>
          </div>

          <div class="col-12 col-lg-4">
            <div class="card rounded-4">
              <div class="card-body d-flex gap-3 align-items-center">
                <div
                  class="card-icon2 d-flex align-items-center justify-content-center p-3 rounded-4"
                >
                  <i class="fa-solid fa-star"></i>
                </div>

                <div class="card-titel">
                  <p class="text-secondary m-0">FAVORITES</p>
                  <span id="favoritecount" class="fs-4 fw-bold m-0">0</span>
                </div>
              </div>
            </div>
          </div>

          <div class="col-12 col-lg-4">
            <div class="card rounded-4">
              <div class="card-body d-flex gap-3 align-items-center">
                <div
                  class="card-icon3 d-flex align-items-center justify-content-center p-3 rounded-4"
                >
                  <i class="fa-solid fa-heart-pulse"></i>
                </div>

                <div class="card-titel">
                  <p class="text-secondary m-0">EMERGENCY</p>
                  <span id="emergencycount" class="fs-4 fw-bold m-0">0</span>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="row g-4">
          <div class="col-12 col-lg-9">
            <div class="inner">
              <div class="mb-3">
                <h2 class="fw-bold m-0">All Contacts</h2>
                <p class="text-secondary m-0">
                  Manage and organize your <span id="countparagraph">3</span> contacts
                </p>
              </div>

              <div class="position-relative">
                <input
                  id="searchInput"
                  oninput="searchContact(event.target.value)"
                  type="text"
                  class="form-control px-5 rounded-4"
                  placeholder="Search by name, phone, or email..."
                />
                <div class="search-box position-absolute text-secondary">
                  <i class="fa-solid fa-magnifying-glass"></i>
                </div>
              </div>

              <div id="rowData" class="row g-3 py-4">
                 <div class="empty-state text-center">
                    <div class="empty-icon">
                      <i class="fa-solid fa-address-book"></i>
                    </div>

                    <h4 class="mb-1 fw-bold">No contacts found</h4>

                    <p class="m-0 text-secondary">Click "Add Contact" to get started</p>
                  </div>

                
              </div>
            </div>
          </div>

          <div class="col-12 col-lg-3">
            <!-- Favorites Card -->
            <div  class="side-contact-card favorites-card mb-4">
              <!-- Header -->
              <div class="side-card-header p-3 d-flex align-items-center gap-2">
                <div class="side-card-icon favorites-icon">
                  <i class="fa-solid fa-star"></i>
                </div>

                <div>
                  <h5 class="mb-1">Favorites</h5>
                  <p class="mb-0">Quick access to starred contacts</p>
                </div>
              </div>

              <!-- Contact -->
              <div id="favoriteList" class="side-card-body row p-3">
                
              </div>
            </div>

            <!-- Emergency Card -->
            <div  class="side-contact-card emergency-card">
              <!-- Header -->
              <div class="side-card-header p-3 d-flex align-items-center gap-2">
                <div class="side-card-icon emergency-icon">
                  <i class="fa-solid fa-heart-pulse"></i>
                </div>

                <div>
                  <h5 class="mb-1">Emergency</h5>
                  <p class="mb-0">Important contacts for urgent calls</p>
                </div>
              </div>

              <!-- Contact -->
              <div id="emergencyList" class="side-card-body row p-3">

              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- end section -->

    <!-- bootstrab scribt -->
    <script src="js/bootstrap.bundle.min.js"></script>
    <!-- sweetAlert -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- index js -->
    <script src="js/index.js"></script>
  </body>
</html>
